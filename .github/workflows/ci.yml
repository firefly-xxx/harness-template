name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make verify executable
        run: chmod +x scripts/verify.sh
      - name: Run harness verify
        run: ./scripts/verify.sh
      # Add language setup (setup-node, setup-python, etc.) and extra steps as needed
